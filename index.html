<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orchard Locator</title>
<meta name="theme-color" content="#2f5d3a">
<script>
  // Apply the saved light/dark choice before the page paints, so it never flashes the wrong theme.
  try { const th = localStorage.getItem('orchard-gps-theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch {}
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<style>
/* Layout: one narrow column. Header with language switch, GPS reading with map, farm details. */
:root {
  --bg: #f4f1e8;
  --surface: #fffdf7;
  --ink: #1f2a22;
  --muted: #667066;
  --line: #e2dccb;
  --leaf: #2f5d3a;
  --leaf-ink: #ffffff;
  --good: #2e7d4a;
  --warn: #b26a00;
  --bad: #b3362b;
  --wa: #177a42;
  --wa-ink: #ffffff;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-num: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
/* Dark: follows the phone unless the farmer picked light or dark with the header button. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a15; --surface: #1c241d; --ink: #e9eee6; --muted: #a3ada0; --line: #2f3a30;
    --leaf: #6fb07c; --leaf-ink: #0d1a10; --good: #6fcf8f; --warn: #f0a83c; --bad: #ff7b6e; --wa: #35c46f; --wa-ink: #06210f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a15; --surface: #1c241d; --ink: #e9eee6; --muted: #a3ada0; --line: #2f3a30;
  --leaf: #6fb07c; --leaf-ink: #0d1a10; --good: #6fcf8f; --warn: #f0a83c; --bad: #ff7b6e; --wa: #35c46f; --wa-ink: #06210f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.map .leaflet-control-attribution { font-size: 9px; line-height: 1.3; max-width: 100%; white-space: normal; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }

header { padding-block: 18px 2px; display: flex; align-items: center; gap: 10px; }
header img { width: 36px; height: 36px; flex: none; }
h1 { font-size: 1.25rem; margin: 0; flex: 1; min-width: 0; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; background: var(--surface); }
.lang button {
  font: inherit; font-size: .85rem; font-weight: 600; border: 0; background: transparent; color: var(--muted);
  padding: 8px 11px; min-height: 38px; cursor: pointer;
}
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--leaf); color: var(--leaf-ink); }
.theme { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; padding: 0; }
.theme svg { width: 20px; height: 20px; }
.theme:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
@media (max-width: 430px) { header img { display: none; } }
@media (max-width: 360px) { h1 { font-size: 1.1rem; } .lang button { padding: 8px 9px; } }

section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; }
h2 { font-size: 1rem; margin: 0 0 14px; font-weight: 650; }

.coords { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.coords div { min-width: 0; }
.k { font-size: .8rem; color: var(--muted); }
.v { font: 600 1.2rem/1.25 var(--font-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.v.dim { color: var(--muted); font-weight: 400; }
.map { position: relative; height: 260px; border-radius: 10px; overflow: hidden; background: var(--line); margin: 0 0 14px; }
#mapView { position: absolute; inset: 0; }
.pin-icon span { position: absolute; left: 10px; top: 10px; width: 24px; height: 24px; border-radius: 50%; background: #e5483b; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.map .undo { position: absolute; left: 10px; bottom: 10px; z-index: 1000; font-weight: 600; font-size: .85rem; border: 0; border-radius: 8px; padding: 8px 12px; background: #fff; color: #1f2a22; box-shadow: 0 1px 4px rgba(0,0,0,.35); cursor: pointer; }
.v .src { font: 500 .75rem var(--font-body); color: var(--muted); margin-left: 6px; }
.status { display: flex; align-items: flex-start; gap: 8px; margin: 16px 0 14px; font-size: .92rem; color: var(--muted); }
.status.on { color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; margin-top: .45em; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.live { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }

.fields { display: grid; gap: 14px; }
label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 6px; }
input[type=text] {
  width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink);
}
input[type=text]:focus { outline: 2px solid var(--leaf); outline-offset: 1px; }
.error { color: var(--bad); font-size: .9rem; margin: 0; font-weight: 600; }

button { font: inherit; }
.btn { font-weight: 600; border-radius: 12px; border: 0; padding: 14px 16px; cursor: pointer; min-height: 50px; width: 100%; }
.btn:focus-visible, .lang button:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
.btn-primary { background: var(--leaf); color: var(--leaf-ink); }
.btn-wa { background: var(--wa); color: var(--wa-ink); font-size: 1.05rem; margin-top: 4px; }
.btn:disabled { opacity: .55; cursor: default; }

.share { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.share .qr { width: 132px; height: 132px; padding: 6px; background: #fff; border-radius: 10px; border: 1px solid var(--line); }
.share .qr img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.share .acts { display: grid; gap: 10px; min-width: 0; }
.share input { font: .82rem var(--font-num); padding: 10px; color: var(--muted); text-overflow: ellipsis; }
.btn-line { background: transparent; color: var(--ink); border: 1px solid var(--line); min-height: 44px; padding: 10px 12px; }
.btn-line.ok { color: var(--good); border-color: var(--good); }
@media (max-width: 360px) { .share { grid-template-columns: 1fr; justify-items: center; } .share .acts { width: 100%; } }

</style>
</head>
<body>
<main>
  <header>
    <img src="icon.svg" alt="">
    <h1 data-t="appName">Orchard Locator</h1>
    <button type="button" class="theme" id="themeBtn">
      <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="lang" role="group" aria-label="Language" data-t-label="langLabel">
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="zh" lang="zh">中文</button>
      <button type="button" data-lang="ms" lang="ms">BM</button>
    </div>
  </header>

  <section aria-labelledby="gps-h">
    <h2 id="gps-h" data-t="gpsTitle">Location</h2>
    <div class="coords">
      <div><div class="k" data-t="lat">Latitude</div><div class="v dim" id="lat">—</div></div>
      <div><div class="k" data-t="lng">Longitude</div><div class="v dim" id="lng">—</div></div>
      <div><div class="k" data-t="elev">Elevation</div><div class="v dim" id="elev">—</div></div>
      <div><div class="k" data-t="acc">Accuracy</div><div class="v dim" id="acc">—</div></div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusText"></span></div>
    <div class="map" id="map" hidden><div id="mapView"></div><button type="button" class="undo" id="undoPin" data-t="undoMove" hidden>Back to GPS</button></div>
    <button class="btn btn-primary" id="gpsBtn" type="button"></button>
  </section>

  <section aria-labelledby="farm-h">
    <h2 id="farm-h" data-t="detailsTitle">Farm details</h2>
    <form id="form" class="fields" novalidate>
      <div>
        <label for="farmer" data-t="farmer">Farmer's name</label>
        <input type="text" id="farmer" autocomplete="name">
      </div>
      <div>
        <label for="zh" data-t="zhName">Location name (中文)</label>
        <input type="text" id="zh" lang="zh">
      </div>
      <div>
        <label for="en" data-t="enName">Location name (English / Malay)</label>
        <input type="text" id="en">
      </div>
      <p class="error" id="formErr" hidden></p>
      <button class="btn btn-wa" type="submit" data-t="send">WhatsApp to Stanley Woo</button>
    </form>
  </section>

  <section aria-labelledby="share-h">
    <h2 id="share-h" data-t="shareTitle">Share this app</h2>
    <div class="share">
      <div class="qr"><img src="qr.svg" alt="QR code to open this app" data-t-alt="qrAlt"></div>
      <div class="acts">
        <input type="text" id="appLink" readonly aria-label="App link" data-t-label="linkLabel" value="https://stanleywoosweeleong.github.io/Myfarmgps/">
        <a class="btn btn-wa" id="shareWa" href="#" target="_blank" rel="noopener" data-t="shareWa" style="display:grid;place-items:center;text-decoration:none;font-size:.95rem">Share on WhatsApp</a>
        <button class="btn btn-line" type="button" id="copyLink" data-t="copyLink">Copy link</button>
        <span class="sr" id="copyStatus" role="status" aria-live="polite"></span>
      </div>
    </div>
  </section>

</main>

<script>
const APP_URL = 'https://stanleywoosweeleong.github.io/Myfarmgps/';
const WA_NUMBER = '60193824740';           // 019-382 4740, Malaysia (+60)
const LANG_KEY = 'orchard-gps-lang';
const GOOD_ACC = 15;                       // metres; stop as soon as the position is this accurate
const STALL_MS = 6000;                     // stop if accuracy has not improved for this long
const MAX_WATCH_MS = 20000;                // never wait longer than this
const GPS_ALT_OK = 15;                     // trust the phone's GPS altitude only if its own vertical error is within this

const T = {
  en: {
    appName: 'Orchard Locator', gpsTitle: 'Location',
    lat: 'Latitude', lng: 'Longitude', elev: 'Elevation', acc: 'Position accuracy', m: 'm', na: 'n/a', srcMap: 'map', srcGps: 'GPS',
    idle: 'Stand in the orchard and tap the button.',
    get: 'Get location', again: 'Read again', reading: 'Reading…',
    searching: 'Searching for satellites…', improving: 'Improving accuracy… ±{n} m',
    fixed: 'Location fixed (±{n} m)', weak: 'Position only accurate to ±{n} m. Drag the pin to your orchard, or move to open sky and read again.',
    adjusted: 'Pin moved by you, {n} m from the GPS reading.', accAdjusted: 'Set by you', undoMove: 'Back to GPS',
    denied: 'Location permission is off. Allow location for this app in your phone settings.',
    timeout: 'GPS timed out. Move to open sky and try again.',
    unavail: 'Could not read GPS. Turn on Location and try again.',
    nogps: 'This phone cannot read GPS.',
    detailsTitle: 'Farm details', farmer: "Farmer's name",
    zhName: 'Location name (中文)', enName: 'Location name (English / Malay)',
    send: 'WhatsApp to Stanley Woo',
    errNoGps: 'Get the location first.', errNoField: 'Fill in at least one field.',
    errOffline: 'No internet. Connect and tap the button again.',
    toDark: 'Switch to dark mode', toLight: 'Switch to light mode',
    errElevWait: 'Still getting the elevation. Tap again in a few seconds.',
    langLabel: 'Language', linkLabel: 'App link', qrAlt: 'QR code to open this app',
    copyFail: 'Copy failed. The link is selected; copy it from your keyboard menu.', copyFailBtn: 'Could not copy',
    shareTitle: 'Share this app', shareWa: 'Share on WhatsApp', copyLink: 'Copy link', copied: 'Link copied',
    shareMsg: 'Orchard Locator: record your orchard\'s GPS location and send it to Stanley Woo.'
  },
  zh: {
    appName: '果园定位', gpsTitle: '位置',
    lat: '纬度', lng: '经度', elev: '海拔', acc: '位置精度', m: '米', na: '无', srcMap: '地图', srcGps: 'GPS',
    idle: '请站在果园内，然后按下按钮。',
    get: '获取位置', again: '重新定位', reading: '定位中…',
    searching: '正在搜索卫星…', improving: '正在提高精度… ±{n} 米',
    fixed: '定位完成（±{n} 米）', weak: '位置精度只有 ±{n} 米。请把红点拖到您的果园，或到空旷处重新定位。',
    adjusted: '红点已由您移动，距离 GPS 读数 {n} 米。', accAdjusted: '手动设定', undoMove: '回到 GPS 位置',
    denied: '定位权限未开启。请在手机设置中允许此应用使用位置。',
    timeout: '定位超时。请到空旷处再试。',
    unavail: '无法读取GPS。请开启定位后再试。',
    nogps: '此手机无法读取GPS。',
    detailsTitle: '农场资料', farmer: '园主姓名',
    zhName: '地名（中文）', enName: '地名（英文／马来文）',
    send: 'WhatsApp 给 Stanley Woo',
    errNoGps: '请先获取位置。', errNoField: '请至少填写一项。',
    errOffline: '没有网络。请连接网络后再按一次。',
    toDark: '切换到深色模式', toLight: '切换到浅色模式',
    errElevWait: '正在获取海拔，请几秒后再按一次。',
    langLabel: '语言', linkLabel: '应用链接', qrAlt: '打开此应用的二维码',
    copyFail: '复制失败。链接已选中，请手动复制。', copyFailBtn: '无法复制',
    shareTitle: '分享此应用', shareWa: '通过 WhatsApp 分享', copyLink: '复制链接', copied: '链接已复制',
    shareMsg: '果园定位：记录果园的 GPS 位置并发送给 Stanley Woo。'
  },
  ms: {
    appName: 'Lokasi Dusun', gpsTitle: 'Lokasi',
    lat: 'Latitud', lng: 'Longitud', elev: 'Ketinggian', acc: 'Ketepatan kedudukan', m: 'm', na: 't/a', srcMap: 'peta', srcGps: 'GPS',
    idle: 'Berdiri di dalam dusun, kemudian tekan butang.',
    get: 'Dapatkan lokasi', again: 'Baca semula', reading: 'Sedang membaca…',
    searching: 'Mencari satelit…', improving: 'Meningkatkan ketepatan… ±{n} m',
    fixed: 'Lokasi diperoleh (±{n} m)', weak: 'Kedudukan hanya tepat ±{n} m. Seret pin ke dusun anda, atau pergi ke kawasan lapang dan baca semula.',
    adjusted: 'Pin dialih oleh anda, {n} m dari bacaan GPS.', accAdjusted: 'Ditetapkan oleh anda', undoMove: 'Kembali ke GPS',
    denied: 'Kebenaran lokasi tidak dihidupkan. Benarkan lokasi untuk aplikasi ini dalam tetapan telefon.',
    timeout: 'GPS tamat masa. Pergi ke kawasan lapang dan cuba lagi.',
    unavail: 'Tidak dapat membaca GPS. Hidupkan Lokasi dan cuba lagi.',
    nogps: 'Telefon ini tidak dapat membaca GPS.',
    detailsTitle: 'Butiran ladang', farmer: 'Nama petani',
    zhName: 'Nama tempat (中文)', enName: 'Nama tempat (Inggeris / Melayu)',
    send: 'WhatsApp kepada Stanley Woo',
    errNoGps: 'Dapatkan lokasi dahulu.', errNoField: 'Isi sekurang-kurangnya satu ruangan.',
    errOffline: 'Tiada internet. Sambung dan tekan butang sekali lagi.',
    toDark: 'Tukar ke mod gelap', toLight: 'Tukar ke mod cerah',
    errElevWait: 'Masih mendapatkan ketinggian. Tekan sekali lagi dalam beberapa saat.',
    langLabel: 'Bahasa', linkLabel: 'Pautan aplikasi', qrAlt: 'Kod QR untuk membuka aplikasi ini',
    copyFail: 'Gagal menyalin. Pautan telah dipilih; salin secara manual.', copyFailBtn: 'Gagal menyalin',
    shareTitle: 'Kongsi aplikasi ini', shareWa: 'Kongsi di WhatsApp', copyLink: 'Salin pautan', copied: 'Pautan disalin',
    shareMsg: 'Lokasi Dusun: rekod lokasi GPS dusun anda dan hantar kepada Stanley Woo.'
  }
};
const HTML_LANG = { en: 'en', zh: 'zh-Hans', ms: 'ms' };

const $ = id => document.getElementById(id);
let lang = 'en';
let best = null;          // best fix so far: {lat,lng,acc,alt,time}
let watchId = null, watchTimer = null, stallTimer = null;
let elevation = null;     // elevation for the position being sent: {m, src: 'GPS'|'map', acc?}
let gpsElevation = null;  // elevation for the raw GPS fix (restored by Back to GPS)
let pin = null;           // {lat, lng, dist} when the farmer moved the pin; null = raw GPS fix
const pos = () => pin || best;
let gpsState = 'idle';    // idle | reading | done
let status = { key: 'idle', n: null, cls: '', live: false };

function t(key, n) { const s = (T[lang] && T[lang][key]) || T.en[key] || key; return n == null ? s : s.replace('{n}', n); }

/* ---------- language ---------- */
function pickInitialLang() {
  try { const s = localStorage.getItem(LANG_KEY); if (T[s]) return s; } catch {}
  const nav = (navigator.language || '').toLowerCase();
  return nav.startsWith('zh') ? 'zh' : (nav.startsWith('ms') || nav.startsWith('id')) ? 'ms' : 'en';
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch {}
  document.documentElement.lang = HTML_LANG[l];
  document.title = t('appName');
  document.querySelectorAll('[data-t]').forEach(n => { n.textContent = t(n.dataset.t); });
  document.querySelectorAll('[data-t-label]').forEach(n => n.setAttribute('aria-label', t(n.dataset.tLabel)));
  document.querySelectorAll('[data-t-alt]').forEach(n => { n.alt = t(n.dataset.tAlt); });
  const cb = $('copyLink'); if (cb.dataset.state) cb.textContent = t(cb.dataset.state);
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  const err = $('formErr'); if (!err.hidden && err.dataset.key) err.textContent = t(err.dataset.key);
  renderGps(); renderStatus(); renderTheme();
  $('shareWa').href = 'https://wa.me/?text=' + encodeURIComponent(t('shareMsg') + '\n' + APP_URL);
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

/* ---------- GPS ---------- */
function setStatus(key, n, cls, live) { status = { key, n, cls, live }; renderStatus(); }
function renderStatus() {
  $('statusText').textContent = t(status.key, status.n);
  $('dot').className = 'dot' + (status.cls ? ' ' + status.cls : '') + (status.live ? ' live' : '');
  $('status').classList.toggle('on', status.key !== 'idle');
}
function renderGps() {
  const btn = $('gpsBtn');
  btn.disabled = gpsState === 'reading';
  btn.textContent = t(gpsState === 'reading' ? 'reading' : gpsState === 'done' ? 'again' : 'get');
  if (!best) return;
  const set = (id, text) => { $(id).textContent = text; $(id).classList.remove('dim'); };
  const p = pos();
  set('lat', p.lat.toFixed(6));
  set('lng', p.lng.toFixed(6));
  set('acc', pin ? t('accAdjusted') : '±' + Math.round(best.acc) + ' ' + t('m'));
  if (elevation) {
    set('elev', Math.round(elevation.m) + ' ' + t('m'));
    const tag = document.createElement('span'); tag.className = 'src';
    tag.textContent = elevation.src === 'GPS'
      ? t('srcGps') + (elevation.acc != null ? ' ±' + Math.round(elevation.acc) + ' ' + t('m') : '')
      : t('srcMap');
    $('elev').append(tag);
  } else $('elev').textContent = (gpsState === 'reading' || elevBusy()) ? '…' : t('na');
}
function stopWatch() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null; clearTimeout(watchTimer); clearTimeout(stallTimer);
}

/* ---------- elevation ----------
   Use the phone's GPS altitude only when the phone reports it as accurate (altitudeAccuracy ≤ 15 m).
   Otherwise use the terrain height for the point from Open-Meteo (~90 m grid), which is steadier than
   a weak GPS altitude. If that lookup fails (offline, timeout), fall back to the GPS altitude.
   Lookups never block the screen: the position shows at once and elevation fills in when it arrives. */
const ELEV_TIMEOUT_MS = 6000;
let gpsElevBusy = false, pinElevBusy = false;
let runSeq = 0, pinSeq = 0;                // bump to ignore slow answers for an older reading / pin position
const elevBusy = () => pin ? pinElevBusy : gpsElevBusy;
async function lookupElevation(lat, lng) {
  if (!navigator.onLine) return null;
  const ctl = 'AbortController' in window ? new AbortController() : null;
  const timer = ctl && setTimeout(() => ctl.abort(), ELEV_TIMEOUT_MS);
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lng}`, ctl ? { signal: ctl.signal } : {});
    const j = await r.json();
    if (Array.isArray(j.elevation) && j.elevation[0] != null) return { m: j.elevation[0], src: 'map' };
  } catch {} finally { clearTimeout(timer); }
  return null;
}
const gpsAltitude = fix => fix.alt != null ? { m: fix.alt, src: 'GPS', acc: fix.altAcc } : null;
async function loadGpsElevation() {
  const fix = best, run = runSeq, gps = gpsAltitude(fix);
  if (gps && gps.acc != null && gps.acc <= GPS_ALT_OK) { gpsElevation = gps; gpsElevBusy = false; }
  else {
    gpsElevBusy = true; renderGps();
    const e = await lookupElevation(fix.lat, fix.lng);
    if (run !== runSeq) return;
    gpsElevation = e || gps; gpsElevBusy = false;
  }
  if (!pin) elevation = gpsElevation;
  renderGps();
}
async function loadPinElevation() {
  const seq = ++pinSeq, p = pin;
  elevation = null; pinElevBusy = true; renderGps();
  const e = await lookupElevation(p.lat, p.lng);
  if (seq !== pinSeq || !pin) return;
  elevation = e; pinElevBusy = false; renderGps();
}
// Try again for a missing map elevation, e.g. when the internet comes back.
function retryElevation() {
  if (gpsState !== 'done' || !best) return;
  if (pin) { if (!elevation && !pinElevBusy) loadPinElevation(); }
  else if ((!gpsElevation || gpsElevation.src === 'GPS' && !(gpsElevation.acc <= GPS_ALT_OK)) && !gpsElevBusy) loadGpsElevation();
}

/* ---------- satellite map with draggable pin ----------
   Leaflet + Esri World Imagery, loaded only when online. The white circle is the
   GPS accuracy; the red pin is the position that will be sent. Dragging the pin
   or tapping the map moves it, and the reading is then marked as set by the farmer.
   Double-tap zoom is off so a zoom gesture never moves the pin (pinch and +/- still zoom). */
const LEAFLET = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
const LEAFLET_SRI = {
  js: 'sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==',
  css: 'sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=='
};
let leafletP = null, map = null, marker = null, ring = null, mapSeq = 0;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (!leafletP) leafletP = new Promise((res, rej) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = LEAFLET + 'leaflet.css';
    css.integrity = LEAFLET_SRI.css; css.crossOrigin = 'anonymous';
    const js = document.createElement('script'); js.src = LEAFLET + 'leaflet.js';
    js.integrity = LEAFLET_SRI.js; js.crossOrigin = 'anonymous';
    js.onload = res; js.onerror = () => { leafletP = null; js.remove(); css.remove(); rej(); };
    document.head.append(css, js);
  });
  return leafletP;
}
function zoomFor(acc) { return acc <= 20 ? 18 : acc <= 50 ? 17 : acc <= 150 ? 16 : acc <= 500 ? 15 : 13; }
async function showMap() {
  const box = $('map'), seq = ++mapSeq;
  if (gpsState !== 'done' || !best || !navigator.onLine) { box.hidden = true; return; }
  try { await loadLeaflet(); } catch { if (seq === mapSeq) box.hidden = true; return; }
  if (seq !== mapSeq || gpsState !== 'done' || !best) return;   // a new reading started while Leaflet loaded
  box.hidden = false;
  if (!map) {
    map = L.map('mapView', { attributionControl: true, doubleClickZoom: false });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, maxNativeZoom: 18,
      attribution: 'Powered by <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a> | Esri, Maxar, Earthstar Geographics, and the GIS User Community'
    }).addTo(map);
    ring = L.circle([0, 0], { radius: 1, color: '#fff', weight: 2, fillColor: '#fff', fillOpacity: .15, interactive: false }).addTo(map);
    marker = L.marker([0, 0], { draggable: true, autoPan: true, keyboard: false,
      icon: L.divIcon({ className: 'pin-icon', html: '<span></span>', iconSize: [44, 44], iconAnchor: [22, 22] }) }).addTo(map);
    marker.on('dragend', () => movePin(marker.getLatLng()));
    map.on('click', e => movePin(e.latlng));
  } else map.invalidateSize();
  ring.setLatLng([best.lat, best.lng]).setRadius(best.acc);
  marker.setLatLng([pos().lat, pos().lng]);
  map.setView([best.lat, best.lng], zoomFor(best.acc));
}
function movePin(ll) {
  if (!best || gpsState !== 'done') { if (marker && best) marker.setLatLng([pos().lat, pos().lng]); return; }
  marker.setLatLng(ll);
  pin = { lat: ll.lat, lng: ll.lng, dist: map.distance(ll, [best.lat, best.lng]) };
  $('undoPin').hidden = false;
  setStatus('adjusted', Math.round(pin.dist), 'warn');
  if ($('formErr').dataset.key === 'errElevWait') showError(null);
  loadPinElevation();
}
function backToGps() {
  if (!best) return;
  pin = null; pinSeq++; pinElevBusy = false; elevation = gpsElevation;
  if (marker) marker.setLatLng([best.lat, best.lng]);
  $('undoPin').hidden = true;
  renderGps(); gpsStatus();
}
$('undoPin').addEventListener('click', backToGps);
function gpsStatus() {
  const n = Math.round(best.acc);
  if (best.acc <= 25) setStatus('fixed', n, 'good'); else setStatus('weak', n, 'warn');
}

/* ---------- GPS reading ----------
   Keeps the most accurate fix. Stops when it is within GOOD_ACC, when accuracy has not
   improved for STALL_MS, or MAX_WATCH_MS after the first fix. If no fix arrives at all,
   the geolocation timeout (which starts only after permission is granted) reports it,
   and a backstop timer makes sure the button can never stay stuck on "Reading…". */
function finishFix() {
  if (gpsState !== 'reading') return;
  stopWatch();
  if (!best) { gpsState = 'idle'; renderGps(); setStatus('timeout', null, 'bad'); return; }
  gpsState = 'done';
  elevation = gpsElevation = null;
  loadGpsElevation();
  renderGps();
  gpsStatus();
  showMap();
}
function startGps() {
  if (!('geolocation' in navigator)) { setStatus('nogps', null, 'bad'); return; }
  stopWatch();
  best = null; pin = null; elevation = gpsElevation = null; gpsState = 'reading';
  runSeq++; pinSeq++; mapSeq++; gpsElevBusy = pinElevBusy = false;
  $('map').hidden = true; $('undoPin').hidden = true;
  if ($('formErr').dataset.key === 'errElevWait') showError(null);
  ['lat', 'lng', 'elev', 'acc'].forEach(id => { $(id).textContent = '—'; $(id).classList.add('dim'); });
  renderGps();
  setStatus('searching', null, 'warn', true);
  const run = runSeq;
  watchId = navigator.geolocation.watchPosition(p => {
    if (run !== runSeq || gpsState !== 'reading') return;
    const c = p.coords;
    if (!best) { clearTimeout(watchTimer); watchTimer = setTimeout(finishFix, MAX_WATCH_MS); }
    if (!best || c.accuracy < best.acc) {
      best = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, alt: c.altitude, altAcc: c.altitudeAccuracy, time: p.timestamp };
      renderGps();
      setStatus('improving', Math.round(c.accuracy), 'warn', true);
      clearTimeout(stallTimer); stallTimer = setTimeout(finishFix, STALL_MS);
    }
    if (best.acc <= GOOD_ACC) finishFix();
  }, err => {
    if (run !== runSeq || gpsState !== 'reading') return;
    if (best) { finishFix(); return; }
    stopWatch(); gpsState = 'idle'; renderGps();
    setStatus(err.code === 1 ? 'denied' : err.code === 3 ? 'timeout' : 'unavail', null, 'bad');
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: MAX_WATCH_MS });
  // Backstop: if the browser never answers at all (no fix, no error), give up after 2 minutes.
  watchTimer = setTimeout(finishFix, 120000);
}
$('gpsBtn').addEventListener('click', startGps);

/* ---------- WhatsApp message (always English labels, for the recipient) ---------- */
function message(r) {
  const lines = ['*Orchard GPS reading*'];
  if (r.farmer) lines.push('Farmer: ' + r.farmer);
  if (r.zh) lines.push('Location (中文): ' + r.zh);
  if (r.en) lines.push('Location (EN/BM): ' + r.en);
  lines.push('Latitude: ' + r.lat.toFixed(6));
  lines.push('Longitude: ' + r.lng.toFixed(6));
  lines.push('Elevation: ' + (r.elev == null ? 'not available'
    : Math.round(r.elev) + ' m (' + (r.elevSrc === 'GPS' ? 'GPS' + (r.elevAcc != null ? ' ±' + Math.round(r.elevAcc) + ' m' : '') : 'map estimate') + ')'));
  if (r.adjusted) {
    lines.push('Position: adjusted by farmer on map, ' + r.moved + ' m from GPS reading');
    lines.push('GPS reading: ' + r.gpsLat.toFixed(6) + ', ' + r.gpsLng.toFixed(6) + ' (±' + Math.round(r.acc) + ' m)');
  } else lines.push('Position accuracy: ±' + Math.round(r.acc) + ' m');
  lines.push('Time: ' + new Date(r.time).toLocaleString('en-MY'));
  lines.push('Map: https://maps.google.com/?q=' + r.lat.toFixed(6) + ',' + r.lng.toFixed(6));
  return lines.join('\n');
}
// Opens WhatsApp straight from the tap (nothing awaited first), so the phone never blocks it.
// The message uses exactly what is on screen.
function sendWhatsApp(r) {
  const url = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(message(r));
  const w = window.open(url, '_blank');
  if (w) { try { w.opener = null; } catch {} }
  else location.href = url;
}

/* ---------- form ---------- */
function showError(key) { const e = $('formErr'); e.dataset.key = key || ''; e.textContent = key ? t(key) : ''; e.hidden = !key; }
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const farmer = $('farmer').value.trim(), zh = $('zh').value.trim(), en = $('en').value.trim();
  if (!best || gpsState !== 'done') { showError('errNoGps'); $('gpsBtn').focus(); return; }
  if (!farmer && !zh && !en) { showError('errNoField'); $('farmer').focus(); return; }
  if (!navigator.onLine) { showError('errOffline'); return; }
  if (elevBusy()) { showError('errElevWait'); return; }
  showError(null);
  const p = pos();
  sendWhatsApp({
    time: best.time || Date.now(),
    lat: p.lat, lng: p.lng, acc: best.acc,
    adjusted: !!pin, moved: pin ? Math.round(pin.dist) : 0, gpsLat: best.lat, gpsLng: best.lng,
    elev: elevation ? elevation.m : null, elevSrc: elevation ? elevation.src : null, elevAcc: elevation ? elevation.acc : null,
    farmer, zh, en
  });
});
['farmer', 'zh', 'en'].forEach(id => $(id).addEventListener('input', () => { if ($('formErr').dataset.key === 'errNoField') showError(null); }));
window.addEventListener('online', () => {
  if ($('formErr').dataset.key === 'errOffline') showError(null);
  retryElevation();
  if (gpsState === 'done' && $('map').hidden) showMap();
});

/* ---------- share this app ---------- */
let copyTimer = null;
function copyFallback() {
  const i = $('appLink');
  i.focus(); i.select(); i.setSelectionRange(0, i.value.length);   // iOS needs setSelectionRange
  try { return document.execCommand('copy'); } catch { return false; }
}
$('copyLink').addEventListener('click', async () => {
  let ok = false;
  try { await navigator.clipboard.writeText(APP_URL); ok = true; } catch { ok = copyFallback(); }
  const b = $('copyLink');
  b.dataset.state = ok ? 'copied' : 'copyFailBtn';
  b.textContent = t(b.dataset.state); b.classList.toggle('ok', ok);
  $('copyStatus').textContent = t(ok ? 'copied' : 'copyFail');   // full explanation for screen readers
  if (!ok) copyFallback();                   // leave the link selected so the farmer can copy it by hand
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { delete b.dataset.state; b.textContent = t('copyLink'); b.classList.remove('ok'); $('copyStatus').textContent = ''; }, 2500);
});
$('appLink').addEventListener('focus', e => { e.target.select(); e.target.setSelectionRange(0, e.target.value.length); });

/* ---------- light / dark ---------- */
const THEME_KEY = 'orchard-gps-theme';
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => (document.documentElement.dataset.theme || (darkQuery.matches ? 'dark' : 'light')) === 'dark';
function renderTheme() {
  const dark = isDark();
  $('icoSun').toggleAttribute('hidden', !dark);   // in dark mode show a sun (tap for light), and vice versa
  $('icoMoon').toggleAttribute('hidden', dark);   // (SVG elements have no .hidden property)
  const label = t(dark ? 'toLight' : 'toDark');
  $('themeBtn').setAttribute('aria-label', label); $('themeBtn').title = label;
  document.querySelector('meta[name=theme-color]').content = dark ? '#141a15' : '#2f5d3a';
}
$('themeBtn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch {}
  renderTheme();
});
if (darkQuery.addEventListener) darkQuery.addEventListener('change', renderTheme);
else if (darkQuery.addListener) darkQuery.addListener(renderTheme);   // Safari before iOS 14

setLang(pickInitialLang());

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
