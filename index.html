<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orchard GPS</title>
<meta name="theme-color" content="#2f5d3a">
<script>
  // Apply the saved light/dark choice before the page paints, so it never flashes the wrong theme.
  try { const th = localStorage.getItem('orchard-gps-theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch {}
  // First launch (no valid saved language): show the language picker before anything paints.
  try { if (!['en', 'zh', 'ms'].includes(localStorage.getItem('orchard-gps-lang'))) document.documentElement.classList.add('picking'); }
  catch { document.documentElement.classList.add('picking'); }
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<style>
/* Layout: one narrow column. Header with language switch, GPS reading with map, farm details. */
:root {
  --bg: #f4f1e8;
  --surface: #fffdf7;
  --ink: #1f2a22;
  --muted: #667066;
  --line: #e2dccb;
  --leaf: #2f5d3a;
  --leaf-ink: #ffffff;
  --good: #2e7d4a;
  --warn: #b26a00;
  --bad: #b3362b;
  --wa: #177a42;
  --wa-ink: #ffffff;
  --touch: rgba(31, 42, 34, .06);   /* faint tint of the scroll rails beside the map */
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-num: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  /* Type scale: five sizes, three weights. Nothing a farmer types into is below 16px
     (iPhone zooms the page when a smaller input is tapped). */
  --fs-xs: .8125rem;   /* 13px  small print: data labels, version, map source */
  --fs-sm: .9375rem;   /* 15px  secondary: status, errors, field labels, notices */
  --fs-md: 1rem;       /* 16px  body text and everything typed into */
  --fs-lg: 1.125rem;   /* 18px  section headings, main buttons */
  --fs-xl: 1.375rem;   /* 22px  the readings: latitude, longitude, elevation, accuracy */
  --w-reg: 400; --w-med: 500; --w-bold: 650;
  color-scheme: light;
}
/* Dark: follows the phone unless the farmer picked light or dark with the header button. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a15; --surface: #1c241d; --ink: #e9eee6; --muted: #a3ada0; --line: #2f3a30;
    --leaf: #6fb07c; --leaf-ink: #0d1a10; --good: #6fcf8f; --warn: #f0a83c; --bad: #ff7b6e; --wa: #35c46f; --wa-ink: #06210f; --touch: rgba(255, 255, 255, .06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a15; --surface: #1c241d; --ink: #e9eee6; --muted: #a3ada0; --line: #2f3a30;
  --leaf: #6fb07c; --leaf-ink: #0d1a10; --good: #6fcf8f; --warn: #f0a83c; --bad: #ff7b6e; --wa: #35c46f; --wa-ink: #06210f; --touch: rgba(255, 255, 255, .06);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.map .leaflet-control-attribution { font-size: 9px; line-height: 1.3; max-width: 100%; white-space: normal; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }

header { padding-block: 18px 2px; display: flex; align-items: center; gap: 10px; }
header img { width: 36px; height: 36px; flex: none; }
h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; min-width: 0; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; background: var(--surface); }
.lang button {
  font: inherit; font-size: .875rem; font-weight: var(--w-bold); border: 0; background: transparent; color: var(--muted);
  padding: 8px 11px; min-height: 38px; cursor: pointer;
}
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--leaf); color: var(--leaf-ink); }
.theme { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; padding: 0; }
.theme svg { width: 20px; height: 20px; }
.theme:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
@media (max-width: 430px) { header img { display: none; } }
@media (max-width: 360px) { h1 { font-size: 1.1rem; } .lang button { padding: 8px 9px; } }

section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; }
h2 { font-size: var(--fs-lg); margin: 0 0 14px; font-weight: 700; }

.coords { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.coords div { min-width: 0; }
.k { font-size: var(--fs-xs); color: var(--muted); }
.v { font-size: var(--fs-xl); line-height: 1.25; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow-wrap: anywhere; }
.v.dim { color: var(--muted); font-weight: var(--w-reg); }
.map { position: relative; height: 260px; border-radius: 10px; overflow: hidden; background: var(--line); margin: 0 0 14px; }
#mapView { position: absolute; inset: 0; }
/* Removes the hairline seams between satellite tiles that high-resolution phone screens show
   (a known Leaflet + Chrome/Safari rendering issue). */
.leaflet-container img.leaflet-tile { outline: 1px solid transparent; }
/* Scroll rails: a strip down each side of the map, below its buttons. A vertical swipe that starts
   here scrolls the page instead of panning the map; a tap jumps to Farm details. */
.scrolltouch { position: absolute; top: 84px; bottom: 0; width: 42px; z-index: 650; cursor: pointer; touch-action: pan-y; }
.scrolltouch.left { left: 0; background: linear-gradient(90deg, var(--touch), transparent); border-radius: 0 0 0 10px; }
.scrolltouch.right { right: 0; background: linear-gradient(270deg, var(--touch), transparent); border-radius: 0 0 10px 0; }
.pin-icon span { position: absolute; left: 10px; top: 10px; width: 24px; height: 24px; border-radius: 50%; background: #e5483b; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.map .undo { position: absolute; right: 10px; top: 10px; z-index: 1000; font-weight: var(--w-bold); font-size: .875rem; border: 0; border-radius: 8px; padding: 8px 12px; background: #fff; color: #1f2a22; box-shadow: 0 1px 4px rgba(0,0,0,.35); cursor: pointer; }
.v .src { font: var(--w-med) var(--fs-xs) var(--font-body); letter-spacing: 0; color: var(--muted); margin-left: 6px; }
.status { display: flex; align-items: flex-start; gap: 8px; margin: 16px 0 14px; font-size: var(--fs-sm); color: var(--muted); }
.status.on { color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; margin-top: .45em; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.live { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }

.fields { display: grid; gap: 14px; }
label { display: block; font-weight: var(--w-med); font-size: var(--fs-sm); margin-bottom: 6px; }
input[type=text] {
  width: 100%; font: inherit; font-size: var(--fs-md); padding: 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink);
}
input[type=text]:focus { outline: 2px solid var(--leaf); outline-offset: 1px; }
.error { color: var(--bad); font-size: var(--fs-sm); margin: 0; font-weight: var(--w-med); }
.ferr { margin-top: 6px; }
.req { color: var(--bad); }
.restored { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-sm); }
.restored[hidden] { display: none; }
.restored span { flex: 1; min-width: 12rem; }
.restored button { font-weight: var(--w-bold); border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); padding: 8px 14px; min-height: 40px; cursor: pointer; }
input[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }

button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
.btn { font-size: var(--fs-lg); font-weight: var(--w-bold); border-radius: 12px; border: 0; padding: 14px 16px; cursor: pointer; min-height: 50px; width: 100%; }
.btn:focus-visible, .lang button:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
.btn-primary { background: var(--leaf); color: var(--leaf-ink); }
.btn-wa { background: var(--wa); color: var(--wa-ink); margin-top: 4px; }
.btn:disabled { opacity: .55; cursor: default; }
.preview { position: fixed; inset: 0; z-index: 1800; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; justify-content: center; }
.preview[hidden] { display: none; }
.previewing body { overflow: hidden; }
.sheet { width: 100%; max-width: 560px; max-height: 92dvh; display: flex; flex-direction: column; gap: 12px; background: var(--surface); color: var(--ink); border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -4px 24px rgba(0,0,0,.25); }
.sheet h2 { margin: 0; }
.sheet textarea { flex: 1; min-height: 14rem; width: 100%; resize: none; font: var(--fs-md)/1.5 var(--font-body); padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.sheet textarea:focus { outline: 2px solid var(--leaf); outline-offset: 1px; }
.pvbtns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.pvbtns .btn { margin: 0; }
.foot { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 2px; }
.ver { margin: 0; font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
.sheet .share { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* First-launch language picker: full screen until a language is chosen. */
#langpick { display: none; position: fixed; inset: 0; z-index: 2000; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.picking #langpick { display: flex; }
.picking body { overflow: hidden; }
#langpick:focus { outline: 0; }
#langpick img { width: 88px; height: 88px; border-radius: 20px; }
#langpick .lptitle { margin: 4px 0 14px; font-size: var(--fs-lg); font-weight: var(--w-bold); color: var(--muted); text-align: center; }
#langpick button { width: min(18rem, 84vw); min-height: 58px; font: inherit; font-size: 1.25rem; font-weight: var(--w-bold); border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
#langpick button:active { background: var(--leaf); color: var(--leaf-ink); }
#langpick button:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }

/* "New version" bar */
.toast { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1500; display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -2px 12px rgba(0,0,0,.25); }
.toast[hidden] { display: none; }
.toast span { flex: 1; min-width: 0; font-size: var(--fs-sm); font-weight: var(--w-bold); }
.toast button { font: inherit; font-size: var(--fs-sm); font-weight: var(--w-bold); border: 0; border-radius: 10px; cursor: pointer; min-height: 40px; }
#toastgo { background: var(--leaf); color: var(--leaf-ink); padding: 8px 16px; }
#toastx { background: transparent; color: var(--bg); width: 40px; font-size: 1.1rem; }

.share .btn { height: 50px; min-height: 0; margin: 0; padding: 0 6px; font-size: var(--fs-md); line-height: 1.2; text-align: center; }
.share a.btn { display: grid; place-items: center; text-decoration: none; }
.qrbox { align-self: center; width: min(240px, 70vw); aspect-ratio: 1; padding: 10px; background: #fff; border-radius: 12px; border: 1px solid var(--line); }
.qrbox img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
#appLink { font: var(--fs-md) var(--font-num); padding: 10px; color: var(--muted); text-overflow: ellipsis; }
.btn-line { background: transparent; color: var(--ink); border: 1px solid var(--line); min-height: 44px; padding: 10px 12px; }
.btn-line.ok { color: var(--good); border-color: var(--good); }

</style>
</head>
<body>
<main>
  <header>
    <img src="icon.svg" alt="">
    <h1 data-t="appName">Orchard GPS</h1>
    <button type="button" class="theme" id="themeBtn">
      <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="lang" role="group" aria-label="Language" data-t-label="langLabel">
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="zh" lang="zh">中文</button>
      <button type="button" data-lang="ms" lang="ms">BM</button>
    </div>
  </header>

  <div class="restored" id="restored" role="status" hidden><span id="restoredText"></span><button type="button" id="discard" data-t="discard">Discard</button></div>

  <section aria-labelledby="gps-h">
    <h2 id="gps-h" data-t="gpsTitle">Location</h2>
    <div class="coords">
      <div><div class="k" data-t="lat">Latitude</div><div class="v dim" id="lat">—</div></div>
      <div><div class="k" data-t="lng">Longitude</div><div class="v dim" id="lng">—</div></div>
      <div><div class="k" data-t="elev">Elevation</div><div class="v dim" id="elev">—</div></div>
      <div><div class="k" data-t="acc">Accuracy</div><div class="v dim" id="acc">—</div></div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusText"></span></div>
    <div class="map" id="map" hidden><div id="mapView"></div><div class="scrolltouch left" aria-hidden="true"></div><div class="scrolltouch right" aria-hidden="true"></div><button type="button" class="undo" id="undoPin" data-t="undoMove" hidden>Back to GPS</button></div>
    <button class="btn btn-primary" id="gpsBtn" type="button"></button>
  </section>

  <section aria-labelledby="farm-h">
    <h2 id="farm-h" data-t="detailsTitle">Farm details</h2>
    <form id="form" class="fields" novalidate>
      <div>
        <label for="farmer"><span data-t="farmer">Farmer's name</span> <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="farmer" autocomplete="name" aria-required="true" aria-describedby="farmerErr">
        <p class="error ferr" id="farmerErr" hidden></p>
      </div>
      <div>
        <label for="zh" data-t="zhName">Location name (中文)</label>
        <input type="text" id="zh" lang="zh" aria-describedby="locErr">
      </div>
      <div>
        <label for="en" data-t="enName">Location name (English / Malay)</label>
        <input type="text" id="en" aria-describedby="locErr">
        <p class="error ferr" id="locErr" hidden></p>
      </div>
      <p class="error" id="formErr" hidden></p>
      <button class="btn btn-wa" type="submit" id="sendBtn" data-t="send">WhatsApp to Stanley Woo</button>
    </form>
  </section>


  <div class="foot">
    <p class="ver"><span data-t="version">Version</span> <span id="ver"></span></p>
    <button type="button" class="iconbtn" id="shareBtn" aria-label="Share this app" data-t-label="shareTitle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M8 11H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-2"/></svg>
    </button>
    <span class="sr" id="copyStatus" role="status" aria-live="polite"></span>
  </div>
</main>

<div id="langpick" role="dialog" aria-modal="true" tabindex="-1" aria-label="中文 · English · Bahasa Melayu">
  <img src="icon-192.png" alt="">
  <p class="lptitle">果园坐标 · Orchard GPS · Dusun GPS</p>
  <button type="button" data-lang="zh" lang="zh-Hans">中文</button>
  <button type="button" data-lang="en" lang="en">English</button>
  <button type="button" data-lang="ms" lang="ms">Bahasa Melayu</button>
</div>

<div class="preview" id="preview" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pvTitle">
    <h2 id="pvTitle" data-t="pvTitle">Check your message to Stanley Woo</h2>
    <textarea id="pvText" rows="12" spellcheck="false" aria-labelledby="pvTitle"></textarea>
    <p class="error" id="pvErr" hidden></p>
    <div class="pvbtns">
      <button type="button" class="btn btn-line" id="pvBack" data-t="pvBack">Back</button>
      <button type="button" class="btn btn-wa" id="pvOpen" data-t="pvOpen">Open WhatsApp</button>
    </div>
  </div>
</div>

<div class="preview" id="qrSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <h2 id="qrTitle" data-t="shareTitle">Share this app</h2>
    <div class="qrbox"><img src="qr.svg" alt="QR code to open this app" data-t-alt="qrAlt"></div>
    <input type="text" id="appLink" readonly aria-label="App link" data-t-label="linkLabel" value="https://stanleywoosweeleong.github.io/Myfarmgps/">
    <div class="share">
      <a class="btn btn-wa" id="shareWa" href="#" target="_blank" rel="noopener">WhatsApp</a>
      <button class="btn btn-line" type="button" id="copyLink" data-t="copyLink">Copy link</button>
    </div>
    <button type="button" class="btn btn-line" id="qrClose" data-t="close">Close</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span data-t="updReady">A new version is ready</span>
  <button type="button" id="toastgo" data-t="updRefresh">Refresh</button>
  <button type="button" id="toastx" aria-label="Close" data-t-label="close">✕</button>
</div>

<script>
const APP_URL = 'https://stanleywoosweeleong.github.io/Myfarmgps/';
const WA_NUMBER = '60193824740';           // 019-382 4740, Malaysia (+60)
const LANG_KEY = 'orchard-gps-lang';
const GOOD_ACC = 15;                       // metres; stop as soon as the position is this accurate
const STALL_MS = 6000;                     // stop if accuracy has not improved for this long
const MAX_WATCH_MS = 20000;                // never wait longer than this
const GPS_ALT_OK = 15;                     // trust the phone's GPS altitude only if its own vertical error is within this

const T = {
  en: {
    appName: 'Orchard GPS', gpsTitle: 'Location',
    lat: 'Latitude', lng: 'Longitude', elev: 'Elevation', acc: 'Position accuracy', m: 'm', na: 'n/a', srcMap: 'map', srcGps: 'GPS',
    idle: 'Stand in the orchard and tap the button.',
    get: 'Get location', again: 'Read again', reading: 'Reading…',
    searching: 'Searching for satellites…', improving: 'Improving accuracy… ±{n} m',
    fixed: 'Location fixed (±{n} m). Drag the pin or tap the map to adjust.', weak: 'Position only accurate to ±{n} m. Drag the pin to your orchard, or move to open sky and read again.',
    adjusted: 'Pin moved by you, {n} m from the GPS reading. Tap Lock this spot to use it.', accAdjusted: 'Set by you', undoMove: 'Back to GPS',
    lockPin: 'Lock this spot', unlockPin: 'Move pin', locked: 'Spot locked by you, {n} m from the GPS reading.',
    errLock: 'Tap Lock this spot first, or Back to GPS.',
    denied: 'Location permission is off. Allow location for this app in your phone settings.',
    timeout: 'GPS timed out. Move to open sky and try again.',
    unavail: 'Could not read GPS. Turn on Location and try again.',
    nogps: 'This phone cannot read GPS.',
    detailsTitle: 'Farm details', farmer: "Farmer's name",
    zhName: 'Location name (中文)', enName: 'Location name (English / Malay)',
    send: 'WhatsApp to Stanley Woo',
    errNoGps: 'Get the location first.', errFarmer: 'Please write your name.', errLocation: 'Fill in at least one location name.',
    errOffline: 'No internet. Connect and tap the button again.',
    toDark: 'Switch to dark mode', toLight: 'Switch to light mode',
    restored: 'Restored your unsent details from {n}.', discard: 'Discard',

/* ---------- satellite map with draggable pin ----------

const LEAFLET_SRI = {

  lines.push(t('msgElev') + (r.elev == null ? t('msgNA')
    : m(r.elev) + (r.elevSrc === 'GPS' ? t('msgElevGps', 'GPS' + (r.elevAcc != null ? ' ±' + m(r.elevAcc) : '')) : t('msgElevMap'))));
  if (r.adjusted) {
    lines.push(t('msgAdjusted', m(r.moved)));
    lines.push(t('msgGps') + r.gpsLat.toFixed(6) + ', ' + r.gpsLng.toFixed(6) + ' (±' + m(r.acc) + ')');
  } else lines.push(t('msgAcc') + '±' + m(r.acc));
  lines.push(t('msgTime') + new Date(r.time).toLocaleString(LOCALE[lang]));
  lines.push(t('msgMap') + 'https://maps.google.com/?q=' + r.lat.toFixed(6) + ',' + r.lng.toFixed(6));
  return lines.join('\n');
}
// Opens WhatsApp straight from the tap (nothing awaited first), so the phone never blocks it.
function sendWhatsApp(text) {
  const url = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(text);
  const w = window.open(url, '_blank');
  if (w) { try { w.opener = null; } catch {} sentClean = true; clearDraft(); closePreview(); }
  else location.href = url;                  // draft stays saved, so nothing is lost if the page is left
}

/* ---------- preview: the farmer sees, and can edit, exactly what will be sent ---------- */
function openPreview(text) {
  $('pvText').value = text;
  $('pvOpen').disabled = !text.trim();
  showError(null, 'pvErr');
  $('preview').hidden = false;
  document.documentElement.classList.add('previewing');
  document.querySelector('main').inert = true;
  $('pvText').focus(); $('pvText').setSelectionRange(0, 0); $('pvText').scrollTop = 0;
}
function closePreview() {
  if ($('preview').hidden) return;
  $('preview').hidden = true;
  document.documentElement.classList.remove('previewing');
  document.querySelector('main').inert = false;
  $('sendBtn').focus();
}
$('pvBack').addEventListener('click', closePreview);
$('preview').addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });
$('preview').addEventListener('click', e => { if (e.target.id === 'preview') closePreview(); });   // tap outside the sheet
$('pvText').addEventListener('input', () => { $('pvOpen').disabled = !$('pvText').value.trim(); });
$('pvOpen').addEventListener('click', () => {
  if (!navigator.onLine) { showError('errOffline', 'pvErr'); return; }
  sendWhatsApp($('pvText').value.trim());
});

/* ---------- form ---------- */
function showError(key, id = 'formErr') { const e = $(id); e.dataset.key = key || ''; e.textContent = key ? t(key) : ''; e.hidden = !key; }
// Farmer's name is required; of the two location names, at least one. Each problem is shown
// under its own field and clears as soon as the farmer types there.
function checkFields(show) {
  const farmerOk = !!$('farmer').value.trim();
  const locOk = !!($('zh').value.trim() || $('en').value.trim());
  if (show || farmerOk) { showError(farmerOk ? null : 'errFarmer', 'farmerErr'); $('farmer').setAttribute('aria-invalid', String(!farmerOk)); }
  if (show || locOk) { showError(locOk ? null : 'errLocation', 'locErr'); ['zh', 'en'].forEach(id => $(id).setAttribute('aria-invalid', String(!locOk))); }
  return { farmerOk, locOk };
}
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const farmer = $('farmer').value.trim(), zh = $('zh').value.trim(), en = $('en').value.trim();
  const { farmerOk, locOk } = checkFields(true);
  const gpsOk = !!best && gpsState === 'done';
  showError(gpsOk ? null : 'errNoGps');
  if (!gpsOk) { $('gpsBtn').focus(); return; }
  if (!farmerOk) { $('farmer').focus(); return; }
  if (!locOk) { $('zh').focus(); return; }
  if (pinUnlocked()) { showError('errLock'); $('gpsBtn').focus(); return; }
  if (elevBusy()) { showError('errElevWait'); return; }
  showError(null);
  const p = pos();
  openPreview(message({
    time: best.time || Date.now(),
    lat: p.lat, lng: p.lng, acc: best.acc,
    adjusted: !!pin, moved: pin ? Math.round(pin.dist) : 0, gpsLat: best.lat, gpsLng: best.lng,
    elev: elevation ? elevation.m : null, elevSrc: elevation ? elevation.src : null, elevAcc: elevation ? elevation.acc : null,
    farmer, zh, en
  }));
});
['farmer', 'zh', 'en'].forEach(id => $(id).addEventListener('input', () => { sentClean = false; checkFields(false); saveDraft(); }));
window.addEventListener('online', () => {
  if ($('formErr').dataset.key === 'errOffline') showError(null);
  if ($('pvErr').dataset.key === 'errOffline') showError(null, 'pvErr');
  retryElevation();
  if (gpsState === 'done' && $('map').hidden) showMap();
});

/* ---------- share this app: the share icon opens a sheet with the QR code, link, WhatsApp and Copy link ---------- */
function openQr() {
  $('qrSheet').hidden = false;
  document.documentElement.classList.add('previewing');
  document.querySelector('main').inert = true;
  $('qrClose').focus();
}
function closeQr() {
  if ($('qrSheet').hidden) return;
  $('qrSheet').hidden = true;
  document.documentElement.classList.remove('previewing');
  document.querySelector('main').inert = false;
  $('shareBtn').focus();
}
$('shareBtn').addEventListener('click', openQr);
$('qrClose').addEventListener('click', closeQr);
$('qrSheet').addEventListener('click', e => { if (e.target.id === 'qrSheet') closeQr(); });
$('qrSheet').addEventListener('keydown', e => { if (e.key === 'Escape') closeQr(); });

let copyTimer = null;
function selectLink() { const i = $('appLink'); i.focus(); i.select(); i.setSelectionRange(0, i.value.length); }   // iOS needs setSelectionRange
$('copyLink').addEventListener('click', async () => {
  let ok = false;
  try { await navigator.clipboard.writeText(APP_URL); ok = true; }
  catch { selectLink(); try { ok = document.execCommand('copy'); } catch {} }
  const b = $('copyLink');
  b.dataset.state = ok ? 'copied' : 'copyFailBtn';
  b.textContent = t(b.dataset.state); b.classList.toggle('ok', ok);
  $('copyStatus').textContent = t(ok ? 'copied' : 'copyFail');   // full explanation for screen readers
  if (!ok) selectLink();                     // leave the link selected, to copy by hand
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { delete b.dataset.state; b.textContent = t('copyLink'); b.classList.remove('ok'); $('copyStatus').textContent = ''; }, 2500);
});
$('appLink').addEventListener('focus', e => { e.target.select(); e.target.setSelectionRange(0, e.target.value.length); });

/* ---------- light / dark ---------- */
const THEME_KEY = 'orchard-gps-theme';
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => (document.documentElement.dataset.theme || (darkQuery.matches ? 'dark' : 'light')) === 'dark';
function renderTheme() {
  const dark = isDark();
  $('icoSun').toggleAttribute('hidden', !dark);   // in dark mode show a sun (tap for light), and vice versa
  $('icoMoon').toggleAttribute('hidden', dark);   // (SVG elements have no .hidden property)
  const label = t(dark ? 'toLight' : 'toDark');
  $('themeBtn').setAttribute('aria-label', label); $('themeBtn').title = label;
  document.querySelector('meta[name=theme-color]').content = dark ? '#141a15' : '#2f5d3a';
}
$('themeBtn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch {}
  renderTheme();
});
if (darkQuery.addEventListener) darkQuery.addEventListener('change', renderTheme);
else if (darkQuery.addListener) darkQuery.addListener(renderTheme);   // Safari before iOS 14

/* ---------- first-launch language picker ---------- */
function showLangPick(on) {
  document.documentElement.classList.toggle('picking', on);
  document.querySelector('main').inert = on;
  $('toast').inert = on;
}
$('langpick').addEventListener('click', e => {
  const l = e.target.closest('button') && e.target.closest('button').dataset.lang;
  if (!T[l]) return;
  setLang(l);                                // saves even when it is the language already showing
  showLangPick(false); window.scrollTo(0, 0);
});

/* ---------- draft: the reading and typed details survive a reload ----------
   Saved on the phone (localStorage) on every change, restored on the next open with a
   notice and a Discard button. Cleared once WhatsApp has opened with the message, and
   dropped after 7 days. Refresh from the update bar restores it without the notice. */
const DRAFT_KEY = 'orchard-gps-draft', DRAFT_MAX_AGE = 7 * 24 * 3600 * 1000, QUIET_KEY = 'orchard-gps-quiet-restore';
let draftReady = false, sentClean = false;
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch {} }
function saveDraft() {
  if (!draftReady) return;                   // never overwrite a saved draft before it is restored
  if (sentClean) { clearDraft(); return; }
  const d = { farmer: $('farmer').value, zh: $('zh').value, en: $('en').value, savedAt: Date.now() };
  if (gpsState === 'done' && best) Object.assign(d, { best, pin, gpsElevation, elevation });
  const empty = !d.farmer.trim() && !d.zh.trim() && !d.en.trim() && !d.best;
  try { if (empty) clearDraft(); else localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch {}
}
function draftTime(ms) {
  const d = new Date(ms), now = new Date(), z = n => String(n).padStart(2, '0');
  const hm = `${z(d.getHours())}:${z(d.getMinutes())}`;
  return d.toDateString() === now.toDateString() ? hm : `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${hm}`;
}
let restoredAt = null;
function renderRestored() { if (restoredAt) $('restoredText').textContent = t('restored', draftTime(restoredAt)); }
function restoreDraft() {
  let d = null, quiet = false;
  try { d = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch {}
  try { quiet = !!sessionStorage.getItem(QUIET_KEY); sessionStorage.removeItem(QUIET_KEY); } catch {}
  draftReady = true;
  if (!d || !d.savedAt || Date.now() - d.savedAt > DRAFT_MAX_AGE) { clearDraft(); return; }
  $('farmer').value = d.farmer || ''; $('zh').value = d.zh || ''; $('en').value = d.en || '';
  if (!quiet) { restoredAt = d.savedAt; renderRestored(); $('restored').hidden = false; }
  if (!d.best) return;
  best = d.best; pin = d.pin || null; gpsElevation = d.gpsElevation || null;
  elevation = pin ? (d.elevation || null) : gpsElevation;
  gpsState = 'done';
  renderGps();
  if (pin) setStatus(pin.locked ? 'locked' : 'adjusted', Math.round(pin.dist), pin.locked ? 'good' : 'warn'); else gpsStatus();
  pinUi();
  retryElevation();
  showMap();
}
// Discard: forget the draft and start over with an empty form and no reading.
$('discard').addEventListener('click', () => {
  clearDraft(); stopWatch();
  best = null; pin = null; elevation = gpsElevation = null; gpsState = 'idle';
  runSeq++; pinSeq++; mapSeq++; gpsElevBusy = pinElevBusy = false;
  ['farmer', 'zh', 'en'].forEach(id => { $(id).value = ''; $(id).removeAttribute('aria-invalid'); });
  ['formErr', 'farmerErr', 'locErr'].forEach(id => showError(null, id));
  ['lat', 'lng', 'elev', 'acc'].forEach(id => { $(id).textContent = '—'; $(id).classList.add('dim'); });
  $('map').hidden = true; $('undoPin').hidden = true;
  restoredAt = null; $('restored').hidden = true;
  renderGps(); setStatus('idle', null, '', false);
  clearDraft();
});

/* ---------- version: when the running copy was published ----------
   Read from the page's Last-Modified header (GitHub Pages sets it on every deploy; it is kept
   with the copy saved for offline use), so it needs no number to maintain. */
(function showVersion() {
  const d = new Date(document.lastModified);
  if (isNaN(d)) return;
  const z = n => String(n).padStart(2, '0');
  $('ver').textContent = `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
})();

/* ---------- start ---------- */
const startLang = pickInitialLang();
setLang(startLang, !FIRST_LAUNCH);         // on first launch nothing is saved until the farmer picks
restoreDraft();
if (FIRST_LAUNCH) { showLangPick(true); $('langpick').focus(); }

/* ---------- updates: the app opens from the saved copy; the service worker checks
   for a newer one and this bar offers it ---------- */
$('toastgo').addEventListener('click', () => { saveDraft(); try { sessionStorage.setItem(QUIET_KEY, '1'); } catch {} location.reload(); });
$('toastx').addEventListener('click', () => { $('toast').hidden = true; });
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const askForUpdate = () => {
    if (navigator.onLine === false) return;
    navigator.serviceWorker.ready.then(reg => { if (reg.active) reg.active.postMessage('check'); }).catch(() => {});
  };
  navigator.serviceWorker.addEventListener('message', e => { if (e.data === 'updated') $('toast').hidden = false; });
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').then(askForUpdate).catch(() => {}); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') askForUpdate(); });
}
</script>
